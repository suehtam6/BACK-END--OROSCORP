components:
  schemas:

    # Nivel de acesso
    NivelAcesso:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 20
          example: "ADM"

    # Status de Conta
    StatusConta:
      required:
        - status
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          maxLength: 20
          example: "Ativo"

    # Status de Funcionario
    StatusFuncionario:
      required:
        - status
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          maxLength: 20
          example: "Ferias"

    # Status de Setor
    StatusSetor:
      required:
        - status
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          maxLength: 25
          example: "Em manutencao"

    # Status de Ocorrencia
    StatusOcorrencia:
      required:
        - status
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          maxLength: 25
          example: "Em analise"

    # Motivo de Ocorrencia
    MotivoOcorrencia:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 30
          example: "Ausencia de EPI"

    # Status de Camera
    StatusCamera:
      required:
        - status
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          maxLength: 20
          example: "Ativa"

    # Cargo
    Cargo:
      required:
        - cargo
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cargo:
          type: string
          maxLength: 30
          example: "Soldador"

    # Usuario
    Usuario:
      required:
        - nome
        - foto
        - email
        - senha
        - data_nascimento
        - id_nivel_acesso
        - id_status_conta
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
          example: "Carlos Silva"
        foto:
          type: string
          maxLength: 256
          example: "URL da foto do usuario"
        email:
          type: string
          format: email
          maxLength: 256
          example: "carlos@oroscorp.com"
        senha:
          type: string
          format: password
          writeOnly: true
          example: "senha123"
        data_nascimento:
          type: string
          format: date
          example: "1980-05-16"
        id_nivel_acesso:
          type: integer
          example: 1
        id_status_conta:
          type: integer
          example: 1

    # Responsavel
    Responsavel:
      required:
        - cpf
        - id_usuario
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cpf:
          type: string
          maxLength: 15
          example: "123.456.789-00"
        id_usuario:
          type: integer
          example: 2

    # Administrador
    Administrador:
      required:
        - cnpj
        - razao_social
        - id_usuario
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cnpj:
          type: string
          maxLength: 20
          example: "12.345.678/0001-90"
        razao_social:
          type: string
          maxLength: 80
          example: "Oroscorp Industria LTDA"
        id_usuario:
          type: integer
          example: 1

    # Funcionario
    Funcionario:
      required:
        - nome
        - data_nascimento
        - cpf
        - email
        - foto
        - id_cargo
        - id_setor
        - id_status_funcionario
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 80
          example: "Joao Souza"
        data_nascimento:
          type: string
          format: date
          example: "1995-07-10"
        cpf:
          type: string
          maxLength: 15
          example: "987.654.321-00"
        email:
          type: string
          format: email
          maxLength: 256
          example: "joao.souza@oroscorp.com"
        foto:
          type: string
          maxLength: 256
          example: "URL da foto do funcionario"
        id_cargo:
          type: integer
          example: 1
        id_setor:
          type: integer
          example: 1
        id_status_funcionario:
          type: integer
          example: 1

    # Setor
    Setor:
      required:
        - nome
        - descricao
        - foto
        - local
        - id_status_setor
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 80
          example: "Soldagem"
        descricao:
          type: string
          maxLength: 500
          example: "Setor responsavel pela soldagem de estruturas metalicas"
        foto:
          type: string
          maxLength: 256
          example: "URL da foto do setor"
        local:
          type: string
          maxLength: 80
          example: "Galpao A, piso 1"
        id_status_setor:
          type: integer
          example: 1

    # Setor x Funcionario
    SetorFuncionario:
      required:
        - id_setor
        - id_funcionario
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_setor:
          type: integer
          example: 1
        id_funcionario:
          type: integer
          example: 1

    # Setor x Responsavel
    SetorResponsavel:
      required:
        - id_setor
        - id_responsavel
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_setor:
          type: integer
          example: 1
        id_responsavel:
          type: integer
          example: 1

    # Camera
    Camera:
      required:
        - nome
        - descricao
        - endereco_stream
        - id_setor
        - id_status_camera
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 30
          example: "Camera 03"
        descricao:
          type: string
          maxLength: 500
          example: "Camera fixa voltada para a bancada de solda"
        endereco_stream:
          type: string
          maxLength: 255
          example: "rtsp://192.168.0.13:554/stream"
        id_setor:
          type: integer
          example: 1
        id_status_camera:
          type: integer
          example: 1

    # EPI
    Epi:
      required:
        - nome
        - descricao
        - qtde
        - foto
        - cor
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 50
          example: "Capacete"
        descricao:
          type: string
          maxLength: 500
          example: "Capacete de seguranca com viseira"
        qtde:
          type: integer
          default: 0
          example: 50
        foto:
          type: string
          maxLength: 256
          example: "URL da foto do EPI"
        cor:
          type: string
          maxLength: 30
          example: "Amarelo"

    # Setor x EPI
    SetorEpi:
      required:
        - id_setor
        - id_epi
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_setor:
          type: integer
          example: 1
        id_epi:
          type: integer
          example: 1

    # Ocorrencia
    Ocorrencia:
      required:
        - descricao
        - id_setor
        - id_motivo_ocorrencia
        - id_status_ocorrencia
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        descricao:
          type: string
          maxLength: 500
          example: "A inteligencia artificial detectou um colaborador sem capacete de seguranca."
        id_setor:
          type: integer
          example: 1
        id_funcionario:
          type: integer
          nullable: true
          description: Nulo quando a IA nao reconheceu o rosto
          example: null
        id_motivo_ocorrencia:
          type: integer
          example: 1
        id_status_ocorrencia:
          type: integer
          example: 1
        id_usuario_registro:
          type: integer
          nullable: true
          description: Nulo quando a ocorrencia foi gerada pela IA
          example: null
        id_usuario_identificacao:
          type: integer
          nullable: true
          description: Quem identificou manualmente o funcionario
          example: null

    # Ocorrencia x EPI
    OcorrenciaEpi:
      required:
        - id_ocorrencia
        - id_epi
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_ocorrencia:
          type: integer
          example: 1
        id_epi:
          type: integer
          example: 1

    # Ocorrencia x Camera (evidencias)
    OcorrenciaCamera:
      required:
        - id_ocorrencia
        - foto
        - data_hora
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_ocorrencia:
          type: integer
          example: 1
        id_camera:
          type: integer
          nullable: true
          description: Nulo quando a foto foi anexada manualmente
          example: 1
        foto:
          type: string
          maxLength: 256
          example: "ocorrencia125_cam03.jpg"
        data_hora:
          type: string
          format: date-time
          example: "2026-08-28T14:32:18"
        confianca_ia:
          type: number
          format: float
          nullable: true
          description: Nulo quando nao houve deteccao automatica
          example: 94.00