components:
  schemas:
  # Usuario
    Usuario:
      required:
        - nome
        - foto
        - email
        - senha
        - data_nascimento
        - id_nivel_acesso
        - id_status_conta
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Matheus"
        foto:
          type: string
          example: "URL da imagem do setor"
        email:
          type: string
          example: "matheus@example.com"
        senha:
          type: string
          example: "senha123"
        data_nascimento:
          type: string
          format: date
        id_nivel_acesso:
          type: integer
        id_status_conta:
          type: integer


  # Nivel de acesso
    NivelAcesso:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Administrador"

    # Status de Conta
    StatusConta:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Ativo"

    # Responsavel
    Responsavel:
      required:      
        - cpf
      type: object
      properties:
        id:
          type: integer
        cpf: 
          type: string
          example: 12345678900

    # Administrador
    Administrador:
      required:
        - cnpj
        - razao_social
        - id_usuario
      type: object
      properties:
        id:
          type: integer
        cnpj:
          type: string
          example: 12345678900000
        razao_social:
          type: string
          example: "Oroscorp"
        id_usuario:
          type: integer
          example: 1

    # Cargo
    Cargo:
      required:
        - nome
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "Soldador"
    
    # Funcionario
    Funcionario:
      required:
        - nome
        - cpf
        - idade
        - email
        - foto
        - id_cargo
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          example: "João da Silva"
        cpf:
          type: string
          example: 12345678900
        id_cargo:
          type: integer
          example: 1
        idade:
          type: integer
          example: 30
        email:
          type: string
          example: "joao.silva@example.com"
        foto:
          type: string
          example: "URL da imagem do funcionário"

