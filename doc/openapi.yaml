  # NIVEL DE ACESSO
  /v1/oroscorp/nivel-acesso:
    post:
      tags:
        - nivel de acesso
      summary: Adiciona um novo nivel de acesso
      description: Endpoint para enviar os dados do nivel de acesso a ser cadastrado
      requestBody:
        description: JSON contendo os dados do novo nivel de acesso a ser inserido no sistema
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NivelAcesso"
        required: true
      responses:
        "201":
          description: Successful operation
        "400":
          description: Invalid input
        "415":
          description: Invalid Content-Type
        "500":
          description: Error Internal server (CONTROLLER/MODEL)
    get:
      tags:
        - nivel de acesso
      summary: Lista todos os niveis de acesso
      description: Listagem de todos os niveis de acesso que foram cadastrados no sistema
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NivelAcesso"
        "404":
          description: Not Found
        "500":
          description: Error Internal server (CONTROLLER/MODEL)
  /v1/oroscorp/nivel-acesso/{id}:
    get:
      tags:
        - nivel de acesso
      summary: Busca um nivel de acesso pelo ID
      description: Retorna um nivel de acesso utilizando o ID do mesmo
      parameters:
        - name: id
          in: path
          description: ID para realizar a busca do nivel de acesso
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NivelAcesso"
        "400":
          description: Invalid ID supplied
        "404":
          description: Not Found
        "500":
          description: Error Internal Server (CONTROLLER/MODEL)
    put:
      tags:
        - nivel de acesso
      summary: Atualizando um nivel de acesso existente
      description: Buscar e atualizar um nivel de acesso utilizando o ID
      parameters:
        - name: id
          in: path
          description: ID do nivel de acesso a ser atualizado
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Dados para atualizar um NivelAcesso
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NivelAcesso"
        required: true
      responses:
        "200":
          description: Successful operation
        "400":
          description: Invalid ID supplied
        "404":
          description: Not Found
        "415":
          description: Invalid content-Type
        "500":
          description: Error Internal Server(CONTROLLER/MODEL)
    delete:
      tags:
        - nivel de acesso
      summary: Delete NivelAcesso
      description: Endpoint para deletar um NivelAcesso existente utilizando o ID
      parameters:
        - name: id
          in: path
